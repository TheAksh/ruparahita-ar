<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vijayraj Ruparahita – View in AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4efe9; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    #ar-button {
      position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%);
      padding: 14px 28px; border: 0; border-radius: 28px; font-size: 17px; font-weight: 600;
      background: #5a3d2b; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }
    #title { position: absolute; z-index: 1; pointer-events: none; top: 16px; left: 0; right: 0; text-align: center; color: #5a3d2b; }
    #title h1 { margin: 0; font-size: 20px; }
    #title p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
    #no-ar { display: none; position: absolute; bottom: 60px; width: 100%; text-align: center; font-size: 14px; color: #5a3d2b; }
    #credits { position: absolute; bottom: 4px; left: 8px; right: 8px; text-align: center; font-size: 9px; line-height: 1.3; color: #8a7a6e; }
    #credits a { color: inherit; }
    #ar-button { bottom: 44px; }
  </style>
</head>
<body>
  <div id="title">
    <h1>Vijayraj Ruparahita</h1>
    <p>2 &amp; 3 BHK Luxurious Flats · Prem Nagar, Solapur</p>
  </div>
  <model-viewer
    src="building_birds.glb"
    ios-src="building_birds.usdz"
    alt="3D model of Vijayraj Ruparahita apartment building with birds"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    autoplay
    shadow-intensity="1"
    exposure="1"
    camera-orbit="35deg 75deg 1.6m"
    camera-target="0m 0.3m 0m"
    auto-rotate
    auto-rotate-delay="3000">
    <button slot="ar-button" id="ar-button">View in your space</button>
    <div id="no-ar">Open this page on a phone to view it in AR.</div>
  </model-viewer>
  <div id="credits">
    Trees: <a href="https://sketchfab.com/3d-models/ginkgo-tree-autumnfall-b3313ffda86a46a8b16a83de1bdb155a">Ginkgo Tree Autumn/Fall</a> by <a href="https://sketchfab.com/PuzzledPapaya">PuzzledPapaya</a>,
    <a href="https://sketchfab.com/3d-models/tree-low-poly-lowpoly-73201f05280d48dcb10ed4ca362d69f8">Tree low poly lowpoly</a> by <a href="https://sketchfab.com/00amza">00amza</a>,
    <a href="https://sketchfab.com/3d-models/low-poly-tree-scene-free-89daa5e21f0d4f08a59dba0d566e88bd">Low Poly Tree Scene Free</a> by <a href="https://sketchfab.com/Nicholas01">Nicholas-3D</a>
    (<a href="http://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, resized);
    lawn texture: <a href="https://sketchfab.com/3d-models/realistic-grass-ba0971efc9ac4176b8f7d2379cd7250b">Realistic grass</a> by <a href="https://sketchfab.com/Pasha.">Pasha</a>
  </div>
  <script>
    const mv = document.querySelector('model-viewer');
    mv.addEventListener('load', () => {
      if (!mv.canActivateAR) document.getElementById('no-ar').style.display = 'block';
    });
  </script>
</body>
</html>
